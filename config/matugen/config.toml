[config]
version_check = false

[templates.m3colors]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/state/quickshell/user/generated/colors.json'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland/colors.lua'
output_path = '~/.config/hypr/hyprland/colors.lua'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprland/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock/colors.conf'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel/fuzzel_theme.ini'
output_path = '~/.config/fuzzel/fuzzel_theme.ini'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.kde_colors]
input_path = '~/.config/matugen/templates/KDE/kde-colors.conf'
output_path = '~/.local/share/color-schemes/Matugen.colors'

[templates.wallpaper]
input_path = '~/.config/matugen/templates/wallpaper.txt'
output_path = '~/.local/state/quickshell/user/generated/wallpaper/path.txt'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty/kitty-colors.conf'
output_path = '~/.config/kitty/matugen-colors.conf'
post_hook = 'bash killall -USR1 kitty || :'

[templates.telegram]
input_path = '~/.config/matugen/templates/telegram/telegram-colors.conf'
output_path = '~/.local/share/TelegramDesktop/telegram.tdesktop-theme'

[templates.zed]
input_path = '~/.config/matugen/templates/zed/zed-colors.json'
output_path = '~/.config/zed/themes/matugen.json'

[templates.obs]
input_path = '~/.config/matugen/templates/obs/obs-colors.conf'
output_path = '~/.config/obs-studio/themes/matugen.obt'

[templates.btop]
input_path = '~/.config/matugen/templates/btop/btop-colors.conf'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 btop || true'

[templates.vesktop]
input_path = '~/.config/matugen/templates/vesktop/vesktop-colors.conf'
output_path = '~/.config/vesktop/themes/material-discord.css'

[templates.obsidian]
input_path = '~/.config/matugen/templates/obsidian/obsidian-colors.conf'
output_path = '~/uni/.obsidian/snippets/obsidian-material3.css'

